    <title>PixelLens | Photography Website</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />

                    <li>

                    <li>

                    <a href="https://www.facebook.com/nagendrakumar.singh.98499/"><i

                    <a href="https://x.com/n_kit__09"><i class="fa-brands fa-twitter"></i></a>
                    <a href="https://www.instagram.com/victim__09?"><i class="fa-brands fa-instagram"></i></a>
                    <a href="https://youtube.com/@seetoshort4235?si=pkuqfjjtZB4oPE_Q"><i
